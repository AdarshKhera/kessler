<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #01040a; color: #fff; font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; overflow: hidden; position: relative; }
  .glow { position: absolute; right: -300px; top: -40px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, rgba(120, 220, 255, 0.55), rgba(40, 110, 170, 0.35) 38%, rgba(6, 26, 48, 0.9) 62%, rgba(1, 4, 10, 0) 72%); box-shadow: 0 0 140px rgba(100, 210, 255, 0.35); }
  svg { position: absolute; right: -300px; top: -40px; }
  .text { position: absolute; left: 80px; top: 150px; width: 560px; }
  h1 { font-size: 104px; font-weight: 600; letter-spacing: -0.03em; }
  p { margin-top: 18px; font-size: 34px; line-height: 1.25; color: rgba(235, 235, 245, 0.72); }
  .chips { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { padding: 10px 20px; border-radius: 999px; font-size: 22px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.9); }
  .by { position: absolute; left: 80px; bottom: 56px; font-size: 22px; color: rgba(235, 235, 245, 0.45); letter-spacing: 0.02em; }
</style></head><body>
  <div class="glow"></div>
  <svg width="820" height="820" viewBox="0 0 820 820" id="dots"></svg>
  <div class="text">
    <h1>Kessler</h1>
    <p>Every satellite above you, live. Then keep zooming out to Pluto.</p>
    <div class="chips"><span>19,000+ objects</span><span>Real orbits</span><span>Solar system</span></div>
  </div>
  <div class="by">Created by Adarsh Khera</div>
  <script>
    const svg = document.getElementById('dots'); let out = ''
    let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647)
    const colors = ['#4de3ff', '#4de3ff', '#4de3ff', '#8f9bff', '#ff3b5c', '#ffd166', '#5cff9d', '#ffffff']
    for (let i = 0; i < 900; i++) {
      const a = rnd() * Math.PI * 2, r = 330 + rnd() * 110, x = 410 + Math.cos(a) * r, y = 410 + Math.sin(a) * r * 0.96
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1 + rnd() * 2).toFixed(1)}" fill="${colors[Math.floor(rnd() * colors.length)]}" opacity="${(0.45 + rnd() * 0.5).toFixed(2)}"/>`
    }
    for (let i = 0; i < 260; i++) {
      const a = rnd() * Math.PI * 2, r = rnd() * 320, x = 410 + Math.cos(a) * r, y = 410 + Math.sin(a) * r
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.6" fill="#9fe6ff" opacity="${(0.15 + rnd() * 0.35).toFixed(2)}"/>`
    }
    svg.innerHTML = out
  </script>
</body></html>
