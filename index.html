<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kessler | Live satellites</title>
    <meta name="description" content="Every satellite above you, live. Real tracking data, calculated in your browser." />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Adarsh Khera" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kessler | Live satellites" />
    <meta property="og:description" content="Every satellite above you, live. Real tracking data, calculated in your browser. Created by Adarsh Khera." />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="./og.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2364d2ff' stroke-width='2'/%3E%3Ccircle cx='23.5' cy='10' r='2.6' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl" tabindex="-1" role="img" aria-label="Interactive 3D globe showing satellites and debris in orbit around Earth"></canvas>
      <header id="brand"></header>
      <div id="top"></div>
      <div id="modes"></div>
      <div id="focusbar"></div>
      <div id="labels"></div>
      <div id="scale" hidden></div>
      <aside id="card" aria-hidden="true" inert></aside>
      <nav id="fleets" aria-label="Fleets"></nav>
      <nav id="bodies" aria-label="Bodies" hidden></nav>
      <div id="time"></div>
      <div id="dock"></div>
      <footer id="foot">
        <button data-open="data">Data: CelesTrak, Launch Library 2</button>
        <span aria-hidden="true">·</span>
        <button data-open="credits">Created by Adarsh Khera</button>
        <span aria-hidden="true">·</span>
        <a id="coffee" target="_blank" rel="noopener noreferrer">Buy me a coffee ☕</a>
      </footer>
      <div id="tip" hidden><b></b><span></span></div>
      <div id="toasts" role="status" aria-live="polite"></div>
      <div id="live" class="sr" aria-live="polite"></div>
      <div id="overlays"></div>
      <div id="veil"></div>
      <div id="boot"></div>
    </div>
    <noscript><p style="color:#fff;font:16px system-ui;padding:24px">Kessler needs JavaScript to calculate satellite positions in your browser.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
